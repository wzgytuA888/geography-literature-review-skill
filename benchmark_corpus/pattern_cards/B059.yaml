overall_review_design:
  review_objective: >-
    Summarize diversity/composition of groundwater microbiomes, their biogeography and assembly mechanisms,
    and their functions in biogeochemical cycling and water health, emphasizing microbial solutions.
  review_scope: prokaryotes, microeukaryotes, viruses; planktonic focus; spatiotemporal biogeographic patterns; assembly processes; functions and One Health.
  review_mode: organism-group -> space -> function narrative synthesis with methods box.
  article_architecture:
    - Abstract
    - Key points
    - Introduction
    - Remarkable diversity and intricate interactions (Prokaryotes/microeukaryotes; symbionts; viruses)
    - Microbial biogeography
    - Community assembly under environmental stress
    - Microbial effects on key [functions/water health]
    - Summary and future
    - Box 1
  organizing_principle: thematic chain — who lives there -> how distributed/assembled -> what they do
  number_of_major_sections: 6
introduction_pattern:
  opening_move: resource-stakes quantification (drinking water >50% of population; irrigation 42%) plus subsurface biomass share (up to 30%).
  problem_contextualization: distinctive conditions (darkness, oligotrophy, restricted dispersal) explain why groundwater microbiomes differ from surface.
  fragmentation_statement: not used; field framed as newly enabled by omics technology.
  gap_or_need_statement: sediment-associated data scarcity declared as scope limit; understanding needed for management.
  review_objective_statement: "\"In this Review, we focus predominantly on planktonic microbial communities..., owing to limited data\"."
  scope_definition: scope restriction tied explicitly to evidence availability — honest data-driven delimitation.
  contribution_statement: synthesis + applied emphasis ("microbial-based solutions for achieving sustainable groundwater health").
  roadmap_pattern: present, four-step ("We first describe... We further summarize... In addition... Finally...").
