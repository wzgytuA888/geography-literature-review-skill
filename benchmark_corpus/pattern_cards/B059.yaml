  contradiction_handling: unresolved items flagged as undetermined rather than forced into agreement.
  boundary_condition_handling: generalizations conditioned on aquifer confinement and hydrogeochemical setting.
  limitation_handling: data-absence hedges tied directly to agenda items.
  gap_identification_pattern: non-knowledge verbs mark gaps; scope-excluded domains flagged for future work.
