geography_reasoning:
  whether_geography_is_central: yes-structural — precipitation-defined grassland zones organize explanation
  spatial_scale_usage: plot experiments -> climate zones -> whole plateau, with explicit scaling caution
  regional_differentiation_usage: meadow/steppe/desert-steppe zonation determines responses everywhere
  spatial_heterogeneity_usage: distance-decay degradation around settlements and roads quantified
  cross_scale_usage: plot-scale mechanisms checked against plateau-scale residuals before acceptance
  place_context_usage: named basins and counties anchor policy examples
  human_environment_usage: pastoral economy, herder survey percentages and compensation policy integrated as system components
  flow_network_usage: none
  spatial_dependence_usage: degraded-area concentration within 10 km of roads used as causal evidence
  conditions_triggering_geographic_explanation:
    - when response signs flip between precipitation zones
    - when human-activity proxies vary spatially (settlements, roads, fences)
    - when attribution must be resolved differently at different scales
figure_strategy:
  total_figures: 5
  figure_roles: [driver-impact framework schematic, climate-gradient experiment map, NDVI trend composite, climate-effect meta-panel with n counts, anthropogenic-effect meta-panel]
  conceptual_framework: Fig. 1 boxes drivers, receptors and broader impacts with feedback arrows
  taxonomy: grassland-type classification mapped against climate space
  mechanism: Fig. 4 separates temperature/precipitation/grazing effect channels
  timeline: Fig. 3 segmented trend lines mark policy-relevant breaks
  map: Figs. 2-3 map experiments and vegetation trends across the plateau
  workflow: none
  evidence_summary: Table 1 tabulates driver contributions per indicator — the paper's verdict device
  figure_text_relation: captions report sample sizes and significance stars; text interprets exceptions
gap_and_agenda:
  how_gaps_are_derived: from unresolvable attributions and missing observation classes surfaced during synthesis
  types_of_gaps: [measurement (ground species-composition data), mechanistic (driver interactions), predictive (carrying-capacity thresholds)]
  evidence_required_before_gap_claim: shown failure of current datasets/products to resolve the question
  future_agenda_structure: management-oriented agenda keyed to identified gaps
  specificity_of_future_questions: thresholds and interaction effects named as measurable targets
quality_features:
  major_strengths:
    - settles a live controversy with an explicit scale-dependence verdict
    - effect-size discipline (means, errors, n) imported from meta-analysis practice
    - herder survey data humanizes the management layer
  transferable_patterns:
    - stage the field's core controversy in sentence one of the introduction
    - require observational, experimental and gradient evidence to converge before attribution
    - attach sample sizes to every pooled percentage you synthesize
  unique_but_nontransferable_features: dense local experiment network enables true meta-pooling
  risks_of_imitation: percentage-dense prose needs careful signposting to stay readable
anti_patterns:
  weak_patterns_to_avoid:
    - adjudicating driver dominance from one evidence type alone
