geography_reasoning:
  whether_geography_is_central: yes — spatial gradients are primary evidence form.
  spatial_scale_usage: depth profiles, lake size, region, hemisphere, globe layered systematically.
  regional_differentiation_usage: continent-level rankings (Asia largest decline, South America smallest); cold-vs-tropical baselines.
  spatial_heterogeneity_usage: morphometry (area, depth, trophic state) invoked to explain divergent DO trajectories.
  cross_scale_usage: seasonal-to-decadal x local-to-global crossed in trend section design.
  place_context_usage: named lakes (Erie, Taihu, English Lake District) anchor socioeconomic vignettes.
  human_environment_usage: land use, reservoirs and warming as coupled drivers; equity dimension in impacts.
  flow_network_usage: river networks and hydrological connectivity as transport paths.
  spatial_dependence_usage: stratification physics ties depth structure to oxygen depletion.
  conditions_triggering_geographic_explanation:
    - when baseline climate alters sensitivity identically-acting drivers
    - when morphology modulates a universal mechanism
    - when impacts translate into place-bound economic losses
