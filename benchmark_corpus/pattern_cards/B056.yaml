overall_review_design:
  review_objective: >-
    Outline global trends, drivers, ecological and socioeconomic impacts of inland-water deoxygenation,
    plus management options, knowledge gaps and future directions.
  review_scope: lakes and rivers; spatial/seasonal/decadal trends; climate and human drivers; ecosystem and societal impacts; mitigation.
  review_mode: pressure-state-impact-response narrative synthesis.
  article_architecture:
    - Abstract
    - Introduction
    - Deoxygenation trends (Global spatial variation / Seasonal and short-term variability / Long-term temporal trends)
    - Drivers and mechanisms (Climate-induced changes; human activities)
    - Impact on ecosystem
    - Socioeconomic impacts
    - Management and mitigation
    - Summary and future
  organizing_principle: trend -> driver -> impact -> management chain; time-and-space subsections inside the trend section
  number_of_major_sections: 7
introduction_pattern:
  opening_move: functional-importance definition (DO sustains respiration, biogeochemistry) then comparative alarm — "1.5–2 times faster in inland freshwaters than in oceans".
  problem_contextualization: physical/chemical/biological process triad introduced before evidence; heterogeneity announced as complexity source.
  fragmentation_statement: not used; urgency via rate comparison instead.
  gap_or_need_statement: roadmap closes with "we identify knowledge gaps and future research directions".
  review_objective_statement: "\"Review, we outline global trends, drivers, impacts and potential\" [management]."
  scope_definition: lentic vs lotic environments delimited; system heterogeneity declared as organizing complication.
  contribution_statement: synthesis spanning ecology to policy with mitigation emphasis.
  roadmap_pattern: present ("We also explore... Finally, we identify...").
section_architecture:
  section_order: [Abstract, Introduction, Trends, Drivers-mechanisms, Ecosystem impacts, Socioeconomic impacts, Management-mitigation, Summary-future]
  dominant_logic: state-of-environment report arc from observation to response
  chronological_logic: partial
  thematic_logic: central
  mechanism_logic: central
  scale_logic: partial
  region_logic: partial
  method_logic: none
  transition_between_sections:
    - "\"This section outlines spatial heterogeneity...\" previews"
    - driver section explicitly framed as explaining patterns shown in trend section
argumentation:
  dominant_argument_pattern: pattern-then-mechanism - establish the quantified trend first, then apportion causes.
  claim_evidence_relation: rates reported with uncertainties and sample sizes; mechanisms receive percentage-share attributions.
  comparison_pattern: continent, hemisphere and lake-size contrasts; lentic-versus-lotic parallels.
  contradiction_handling: divergent trajectories reconciled via baseline-dependence and morphometry.
  boundary_condition_handling: mitigation effectiveness conditioned on lake size, depth and cost.
  limitation_handling: projection uncertainty itemized (model variability, extrapolation limits, data scarcity).
  gap_identification_pattern: closing-section gap enumeration promised verbatim in the Introduction roadmap.
synthesis:
  synthesis_unit: quantified pattern or mechanism share
  study_by_study_ratio: low
  multi_source_synthesis_pattern:
    - regional statistics compiled into ranked comparisons (continent means with uncertainties)
    - mechanism attribution shares ("accounts for an average of ~55% of observed surface-water deoxygenation")
    - feedback-loop chains linking land use, hypoxia and GHG emissions
  consensus_pattern: direction-of-trend stated globally with % of systems affected.
  controversy_pattern: uncertainty paragraphs itemize sources (model variability, extrapolation limits).
  reconciliation_pattern: resolves tropical anomalies via baseline-dependence of solubility sensitivity.
  evidence_weighting_pattern: large-sample syntheses weighted above single-lake studies; case events used as illustration.
paragraph_rhetoric:
  common_rhetorical_moves:
    - statistic-dense topic sentences (value +/- sd by continent)
    - mechanism decomposition (supply vs consumption)
    - economic consequence vignettes (named lakes/events)
  typical_move_sequences:
    - [global value, regional gradient, controlling mechanism, exception]
  topic_sentence_pattern: magnitude-first ("Annual DO concentrations in global lake surface waters averaged...").
  synthesis_sentence_pattern: gradient statements pairing latitudinal and altitudinal axes in one sentence.
  contrast_sentence_pattern: hemisphere contrasts (NH vs SH seasonal amplitude).
  limitation_sentence_pattern: enumerated uncertainty inventories at projection stage.
  transition_pattern: preview sentences; figure-anchored handoffs.
  paragraph_length_profile: q25=418, median=618, p75=797 chars; shortest median in batch — high information density.
