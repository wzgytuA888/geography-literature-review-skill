quality_features:
  major_strengths:
    - naming a new cycle concept organizes dispersed literatures
    - mirrored baseline/perturbation design makes disturbance legible
    - evidence tables label unknowns instead of omitting them
  transferable_patterns:
    - establish baseline system before documenting perturbation
    - open with an explicit fragmentation/silo statement to justify scope
    - use paired tables/panels (natural vs altered) as the core device
  unique_but_nontransferable_features: cycle-diagram grammar suits biogeochemical topics
  risks_of_imitation: framework coinage can feel imposed if the silo claim is weakly evidenced
anti_patterns:
