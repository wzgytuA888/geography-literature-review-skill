    - national case budget (USA) scaled to argue global significance
    - syndrome framing pooling co-occurring impacts (FSS)
  consensus_pattern: process existence treated as settled; magnitudes carry ranges
  controversy_pattern: UNKNOWN
  reconciliation_pattern: separate literatures joined by showing shared flowpaths
  evidence_weighting_pattern: measured fluxes > modelled estimates > unknowns explicitly labelled
