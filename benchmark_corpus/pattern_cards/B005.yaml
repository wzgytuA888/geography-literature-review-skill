bibliographic:
  title: The anthropogenic salt cycle
  authors: [UNKNOWN]           # not captured in digest
  journal: Nature Reviews Earth & Environment
  year: 2023
  doi: 10.1038/s43017-023-00485-y
  review_type: conceptual      # cycle-framework narrative
overall_review_design:
  review_objective: >-
    Establish a baseline natural salt cycle, then characterize the anthropogenic salt
    cycle and its cascading impacts across Earth spheres.
  review_scope: >-
    Major ions; geologic/terrestrial/aquatic/atmospheric processes; production and use;
    salinization of soil, water, air; management outlook.
  review_mode: >-
    Framework-first narrative: reservoir-flux cycle logic extended from natural to
    human-dominated operation.
  article_architecture:
    - Abstract
    - Introduction
    - Salts on Earth (definitions; geologic and terrestrial processes; processes in water)
    - Anthropogenic disturbances (production/use; sphere-by-sphere flux alterations)
    - Cascading impacts
    - Summary and future
    - Table 1 natural-cycle processes/fluxes; Table 2 anthropogenic processes/fluxes
  organizing_principle: mixed — mechanistic cycle framework with sphere-by-sphere thematic ordering
  number_of_major_sections: 5-6   # exact count partly obscured by two-column extraction
introduction_pattern:
  opening_move: essentiality definition ("Salt ... is essential for regulating a variety of biological, geological and chemical processes")
  problem_contextualization: quantified production/consumption figures (Mt-scale) establish perturbation size
  fragmentation_statement: explicit silo claim — "soil salinization is often considered independently of freshwater salinization"
  gap_or_need_statement: baseline needed first — "a baseline set of natural salt-related processes must be established"
  review_objective_statement: present via abstract framing of the anthropogenic salt cycle concept
  scope_definition: term "salt" defined operationally in opening section
  contribution_statement: coinage/framing move — names the anthropogenic salt cycle as its synthesis object
  roadmap_pattern: UNKNOWN      # no explicit sentence roadmap captured
section_architecture:
  section_order: [Introduction, Salts on Earth (natural baseline), Processes in water, Anthropogenic cycle by sphere, Cascading impacts, Summary and future]
  dominant_logic: baseline -> perturbation -> consequence chain mapped onto a shared cycle diagram
  chronological_logic: partial      # twentieth-century rise of anthropogenic fluxes
  thematic_logic: central           # sphere-organized (litho/pedo/hydro/atmo/technosphere)
  mechanism_logic: central          # every impact traced to a transport/process pathway
  scale_logic: partial              # global budgets with regional examples
  region_logic: none                # regions exemplify, never structure
  method_logic: partial             # budget estimation illustrated for the USA
  transition_between_sections:
    - baseline-to-perturbation hinge sentence introducing the anthropogenic cycle
    - impact cascade follows naturally once flux vocabulary is set
argumentation:
