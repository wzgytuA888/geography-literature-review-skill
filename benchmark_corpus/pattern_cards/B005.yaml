  claim_evidence_relation: numeric fluxes with ranges; uncertainty admitted where values unknown
  comparison_pattern: natural vs anthropogenic cycle mirrored tables and figure panels
  contradiction_handling: reconciles independent literature strands by placing them in one flux table
  boundary_condition_handling: order-of-magnitude reasoning declared when precision unavailable
  limitation_handling: "While acknowledging uncertainties, these values conservatively suggest ..." style hedges
  gap_identification_pattern: quantification gap — named missing terms in global budgets
synthesis:
