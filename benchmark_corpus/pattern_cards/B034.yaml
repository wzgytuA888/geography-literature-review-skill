  consensus_pattern: strong claims where mechanisms converge (depositional burial advantage)
  controversy_pattern: debate named early then adjudicated by proposing reversed control hierarchy for emissions
  reconciliation_pattern: offsetting effects reconciled quantitatively (accumulation loss ~offset by methane suppression)
  evidence_weighting_pattern: observational gradients and whole-system experiments weighted above single-site studies
