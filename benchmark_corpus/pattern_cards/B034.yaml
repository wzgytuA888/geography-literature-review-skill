overall_review_design:
  review_objective: Integrate geomorphic and ecological controls on how sea level rise reshapes the coastal carbon sink.
  review_scope: marshes, mangroves and seagrass; regional-to-continental ecosystem transitions; carbon sequestration plus CH4 emissions
  review_mode: argument-driven synthesis advancing a two-pillar thesis with a continental quantification
  article_architecture: [Abstract, Introduction, Geomorphic constraints, Ecological constraints, Summary and future]
  organizing_principle: thematic — two constraint pillars (geomorphic vs ecological) in deliberate division of labor
  number_of_major_sections: 4
introduction_pattern:
  opening_move: magnitude-stakes framing ("Approximately half of all marine soil carbon is buried" in vegetated coasts)
  problem_contextualization: boundary-location vulnerability (land–sea margin, moving target) sets up SLR threat
  fragmentation_statement: debate framing — "a subject of debate5–7"; divergent predictions (moderate gains to catastrophic losses) stated as spread
  gap_or_need_statement: need for landscape-scale budgets crossing traditional ecosystem boundaries and including greenhouse gases
  review_objective_statement: "In this Review, we explore how geomorphology and ecology interact to determine" SLR effects on the sink
  scope_definition: scale bound declared ("regional to continental scales") with management caveat acknowledged
  contribution_statement: thesis claim advanced explicitly ("we argue that the persistence of the coastal carbon sink depends principally on...")
  roadmap_pattern: present — "We first consider... before considering... Nevertheless, we argue..." sequence mirrors sections
section_architecture:
  section_order: [Introduction, Geomorphic constraints, Ecological constraints, Summary and future]
  dominant_logic: two-pillar comparative architecture; each pillar gets mechanism → evidence → quantification
  chronological_logic: none
  thematic_logic: central
  mechanism_logic: central (accommodation space, salinity suppression of methanogenesis)
  scale_logic: partial (vertical vs lateral accommodation space distinguished)
  region_logic: partial (US continental roll-up as quantified case)
  method_logic: partial (Table 1 accounting method documented in footnotes)
  transition_between_sections:
    - reversal pivot between pillars ("We propose that the relative importance ... is reversed when considering emissions")
    - pillar-summary sentence closing geomorphic section before ecological section opens
argumentation:
  dominant_argument_pattern: constraint claim → mechanism chain → cross-continental empirical correlation
  claim_evidence_relation: correlations between accumulation rates and relative SLR cited with multi-study support; Table 1 supplies derived net values
  comparison_pattern: sequestration-vs-emission control contrast structures the whole argument
  contradiction_handling: opposing predictions held open ("range from moderate gains ... to catastrophic losses") then conditioned
  boundary_condition_handling: threshold rate beyond which ecosystems deteriorate treated as explicit condition
  limitation_handling: budget data scarcity admitted ("similar landscape-scale carbon budgets have not been developed elsewhere")
  gap_identification_pattern: integration gap — disconnected sequestration vs emissions literatures must be joined
synthesis:
