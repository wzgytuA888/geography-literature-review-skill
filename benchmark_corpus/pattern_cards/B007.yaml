document_id: B007
bibliographic:
  title: Irrigation in the Earth system
  authors: [UNKNOWN]           # not captured in digest
  journal: Nature Reviews Earth & Environment
  year: 2023
  doi: 10.1038/s43017-023-00438-5
  review_type: thematic-mixed  # data-audit + interaction-mechanism narrative
overall_review_design:
  review_objective: >-
    Assess how well irrigation is quantified (data, models), how irrigation interacts
    with climate/environment, and what sustainable futures and research steps follow.
  review_scope: >-
    Global irrigated area and water use; census vs remote sensing vs process models;
    irrigation-climate-biogeochemistry interactions; future demand; uncertainties;
    sustainable irrigation potential.
  review_mode: >-
    Audit-and-synthesis narrative — evidence sources graded before mechanisms reviewed,
    with an explicit mid-paper uncertainty section.
  article_architecture:
    - Abstract
    - Introduction
    - The current state of irrigation (census/RS estimates; model estimates; global+regional changes)
    - Irrigation, climate and the environment (interactions)
    - Future climate-irrigation interactions (demand, scenarios)
    - Outstanding uncertainties in irrigation data and modelling   # dedicated gaps section
    - Sustainable irrigation / potential
    - Summary and future
  organizing_principle: mixed — method-source axis first (how do we know?), then mechanism theme, then futures, then uncertainty synthesis
  number_of_major_sections: 7
introduction_pattern:
  opening_move: resource-share statistics ("accounting for ~70% of freshwater withdrawals")
  problem_contextualization: environmental externalities enumerated to widen stakes beyond agriculture
  fragmentation_statement: implicit — data/model/impact communities fragmented; closing calls for cross-disciplinary work
  gap_or_need_statement: uncertainty in data and models precludes responsible policy recommendations
  review_objective_statement: present via explicit roadmap paragraph ("Next, we discuss ... We further consider ... Finally, we suggest ...")
  scope_definition: withdrawal-vs-consumption distinction defined at first use
  contribution_statement: UNKNOWN
  roadmap_pattern: present — full-sentence multi-move signposting
section_architecture:
  section_order: [Introduction, Current state of irrigation, Irrigation-climate-environment interactions, Future climate-irrigation interactions, Outstanding uncertainties, Sustainable irrigation, Summary and future]
  dominant_logic: inventory -> mechanism -> projection -> uncertainty audit -> application
  chronological_logic: partial      # historical expansion vs SSP projections
  thematic_logic: central           # interaction types organize the middle
  mechanism_logic: central          # energy/water partitioning logic throughout
  scale_logic: central              # field -> region -> globe; local vs remote effects distinguished
  region_logic: partial             # hotspot panels anchor the global claims
  method_logic: central             # three evidence streams compared explicitly
  transition_between_sections:
    - roadmap sentences bridge every major move
    - "Nevertheless," concessive pivots into solutions after limitations
argumentation:
  dominant_argument_pattern: source-critique then mechanism exposition then conditional projection
  claim_evidence_relation: numbers always carry provenance (which dataset/report) and known bias direction
  comparison_pattern: dataset-vs-dataset overlays; dryland-vs-irrigated contrast figure; scenario-difference maps
  contradiction_handling: tensions between modelling choices named as "tensions" and left open deliberately
  boundary_condition_handling: regional sensitivity differences stated where generalization fails
  limitation_handling: dedicated section consolidates scattered caveats into a research agenda
  gap_identification_pattern: taxonomy of gaps — data gaps, model-structure gaps, community/interface gaps
synthesis:
  synthesis_unit: theme             # irrigation as coupled human-Earth-system component
  study_by_study_ratio: low-medium
  multi_source_synthesis_pattern:
    - triangulation across census, satellite, and model lines per quantity
    - range reporting when products disagree (3.1-4 M km2 area)
    - mechanism schematics unifying dispersed interaction findings
  consensus_pattern: agreement claimed on hotspot locations despite uncertain totals
  controversy_pattern: debates flagged as active ("remains an active area of inquiry")
  reconciliation_pattern: product disagreement bounded by uncertainty boxes rather than adjudicated
  evidence_weighting_pattern: observation-constrained statements preferred; pure model output labelled
paragraph_rhetoric:
  common_rhetorical_moves: [data provenance, bias diagnosis, mechanism chain, regional instantiation, recommendation]
  typical_move_sequences:
    - [source description, systematic-bias warning, mitigation via second source]
    - [interaction premise, local effect, remote/teleconnected effect]
  topic_sentence_pattern: what a given data stream can provide
  synthesis_sentence_pattern: "Together, these approaches reveal ..." convergence openers
  contrast_sentence_pattern: more-certain vs uncertain impact side-by-side framing
  limitation_sentence_pattern: "Without reliable data constraints, ..." conditional warnings
  transition_pattern: explicit ordinal signposts (Next / We further consider / Finally)
  paragraph_length_profile: q25=491, median=731, p75=988 chars (index stats)
citation_behavior:
  citations_per_paragraph: {p25: 0, median: 2, p75: 4}
  citation_cluster_frequency: moderate; institutional/dataset prose often uncited until claims
  single_vs_cluster: singles for datasets; clusters for impact findings
  seminal_recent_balance: recent5y share 0.256
  citation_location: [sentence-final superscripts, inline report names]
  citation_support_type: [database/report, remote-sensing product, model documentation, empirical finding]
  method_citation_pattern: each dataset/product cited with resolution and vintages noted
  gap_citation_pattern: gaps argued from structural limitations rather than literature counts
geography_reasoning:
  whether_geography_is_central: yes — hotspots, regional contrasts, and atmosphere bridges are the content
  spatial_scale_usage: sub-kilometre sensing to continental basins to globe
  regional_differentiation_usage: named hotspots (Indo-Gangetic, northern China, High Plains) each get panel treatment
  spatial_heterogeneity_usage: maps of irrigated fraction, scenario differences, cooling patterns
  cross_scale_usage: local soil-moisture change linked to planetary-wave-scale effects
  place_context_usage: regions function as testbeds for mechanism claims (Wisconsin, North China Plain)
  human_environment_usage: core — water management decisions are both driver and lever
  flow_network_usage: reservoir/canal systems referenced within water-supply chains
  spatial_dependence_usage: remote climate effects (moisture/heat advection) treated explicitly
  conditions_triggering_geographic_explanation:
    - when land-atmosphere coupling strength varies regionally
    - when water-source type differs (groundwater vs surface)
    - when scenario outcomes diverge across continents
figure_strategy:
  total_figures: 6 (+Box on uncertainty implied by text)
  figure_roles: [multi-product area maps with time series, withdrawal/consumption estimate comparisons, interaction schematic (dryland vs irrigated panels), regional impact difference map, scenario-difference projections, sustainability-potential map]
  conceptual_framework: Fig. 3 two-panel schematic contrasts dryland vs irrigated agriculture couplings
  taxonomy: uncertainty classes organized in Box/text rather than a figure
  mechanism: arrows encode fluxes; dashed arrows reserved for high-uncertainty links
  timeline: Fig. 1f century-scale area-equipped time series
  map: Figs. 1a-e, 4, 5, 6 all map-based evidence
  workflow: none
  evidence_summary: Fig. 2 compares withdrawal/consumption estimates side by side
  figure_text_relation: graphical conventions carry epistemic status (dashed = uncertain)
gap_and_agenda:
  how_gaps_are_derived: consolidated in a dedicated uncertainties section, then converted into near-term tasks
  types_of_gaps: [data (withdrawal reporting gaps), model (irrigation scheme structure), interdisciplinary (health/policy interfaces)]
  evidence_required_before_gap_claim: demonstrated consequence of the gap for model or policy reliability
  future_agenda_structure: prioritized recommendations with methods attached (Monte Carlo, sensitivity testing, peer-review guidelines)
  specificity_of_future_questions: high — practices and frameworks named for immediate adoption
quality_features:
  major_strengths:
    - mid-paper uncertainty audit converts caveats into an agenda
    - graphical encoding of uncertainty (dashed arrows) aligns figure and text registers
    - roadmap paragraph gives readers a contract for a long paper
  transferable_patterns:
    - grade your evidence sources in a section before reviewing findings built on them
    - dedicate one section to consolidating limitations, ending in concrete tasks
    - pair local-effect with remote-effect explanation for any land-surface topic
  unique_but_nontransferable_features: census-vs-satellite audit specific to agricultural data ecosystems
  risks_of_imitation: uncertainty sections can bloat; keep each caveat consequential
anti_patterns:
  weak_patterns_to_avoid:
    - citing datasets without stating their known biases or incentive structures
