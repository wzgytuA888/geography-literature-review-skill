  figure_text_relation: multi-panel figures referenced by letter at claim sites; captions end with take-home sentence ("effects ... are spatially heterogeneous")
gap_and_agenda:
  how_gaps_are_derived: from absent effectiveness evaluations and contested adaptation definitions
  types_of_gaps: [intervention-evidence gap, measurement-standardisation gap, long-term-health understanding gap]
  evidence_required_before_gap_claim: survey of proposed measures showing none evaluated at scale
  future_agenda_structure: research-priority list embedded in summary; maladaptation screening as standing caution
  specificity_of_future_questions: specific enough to operationalise (effectiveness of thresholds, breaks, decision-support tools)
quality_features:
  major_strengths: [parallel-template architecture enabling cross-outcome comparison, statistic-place-source discipline, honest projection caveats, sex-disaggregated reading]
  transferable_patterns: [repeat one internal template across sibling sections, define variables before comparing inconsistent literatures, pool heterogeneous studies into comparable threshold tables, close agenda with maladaptation caveat]
  unique_but_nontransferable_features: [physiological standards apparatus (ISO/NIOSH) specific to occupational health]
  risks_of_imitation: [template repetition becomes mechanical if sections lack genuinely distinct mechanisms; heavy clustering needs real per-statistic sources]
anti_patterns:
  weak_patterns_to_avoid: [averaging across incomparable metric definitions, projecting without stating behavioural assumptions]
