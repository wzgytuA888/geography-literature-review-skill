    - ["framework difference", "example", "implication for decision support"]
  topic_sentence_pattern: actor- or domain-oriented sentence opens paragraphs
  synthesis_sentence_pattern: "To conclude, LCA models multiple cause–effect chains simultaneously" style roll-ups
  contrast_sentence_pattern: "In contrast to PB, LCA models..." explicit comparator pivots
  limitation_sentence_pattern: harmonization difficulties enumerated (spatial/temporal mismatch between models)
  transition_pattern: domain nouns carried into next section's opening; glossary anchors terms
