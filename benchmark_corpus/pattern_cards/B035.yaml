overall_review_design:
  review_objective: Evaluate strengths and weaknesses of LCA as decision-support across four transformational strategies.
  review_scope: LCA applications to decarbonization, circular economy, sustainable consumption and finance, versus planetary boundaries framing
  review_mode: methodological appraisal — tool audit plus domain-by-domain application survey
  article_architecture: [Abstract, Introduction, Life-cycle assessment in brief, Synergies between LCA and planetary boundaries, Decarbonization of energy systems, Sustainable circular economy, Sustainable consumption, Sustainable finance, LCA role for decision support, Summary and future]
  organizing_principle: methodological — concept brief → framework comparison → four parallel application domains → cross-cutting role
  number_of_major_sections: 8
introduction_pattern:
  opening_move: crisis framing ("triple planetary crisis") then tool positioning
  problem_contextualization: transformational strategies named as visionary but unoperationalized — the operationalization deficit is the hook
  fragmentation_statement: prior-review gap stated precisely ("Multiple reviews exist on LCA methodology ... did not investigate the role in guiding decisions")
  gap_or_need_statement: indicators and actionable methods needed for science-based targets; LCA proposed as candidate
  review_objective_statement: "In this Review, we explore the strengths and weaknesses of LCA" for evaluating mitigation strategies
  scope_definition: strategy list enumerated (four domains) as explicit review perimeter
  contribution_statement: comparative mapping of LCA impact pathways against planetary boundaries + coupling opportunities
  roadmap_pattern: present — "We compare... We then discuss... Moreover, we identify weaknesses..." matches section order
section_architecture:
  section_order: [Introduction, Life-cycle assessment in brief, Synergies between LCA and planetary boundaries, Decarbonization of energy systems, Sustainable circular economy, Sustainable consumption, Sustainable finance, LCA role for decision support, Summary and future]
  dominant_logic: tool primer → benchmark comparison → repeated apply-and-assess loop per domain
  chronological_logic: none
  thematic_logic: central (four parallel strategy sections with matching internal structure)
  mechanism_logic: partial (cause–effect chain modeling explained)
  scale_logic: partial (product-level vs economy-wide assessment shift tracked)
  region_logic: partial (regionalization of impact assessment)
  method_logic: central
  transition_between_sections:
    - section-scope announcement ("Here, we compare and contrast LCA and the planetary boundaries framework")
    - glossary block inserted before synthesis sections to level terminology
argumentation:
  dominant_argument_pattern: capability claim → demonstrated application → residual limitation → coupling remedy
  claim_evidence_relation: claims grounded in cited applied studies; trade-offs shown with quantified scenario charts
  comparison_pattern: tool-vs-framework comparison (LCA vs PB) and option-vs-option comparison inside worked example
  contradiction_handling: rebound effects presented as evidence against circular-economy optimism without dismissing it
  boundary_condition_handling: spatial differentiation treated as condition altering identical emissions' impacts
  limitation_handling: weaknesses collected into a dedicated role/decision-support discussion feeding the agenda
  gap_identification_pattern: gap-in-prior-reviews move plus systematic-combination gap (tool couplings ad hoc, not standardized)
synthesis:
  synthesis_unit: theme (application domain); methods compared as objects rather than studies enumerated
  study_by_study_ratio: low
  multi_source_synthesis_pattern:
    - framework-mapping synthesis (LCA pathways onto DPSIR/PB diagram)
    - worked-example synthesis (face-mask case illustrating all four LCA phases)
    - cross-domain trend extraction (scale of assessment shifting product→economy)
  consensus_pattern: best-practice appeals to UNEP-recommended methods as normative anchor
  controversy_pattern: benefit-offset findings (rebound) staged against strategy promises
  reconciliation_pattern: comprehensiveness-accuracy-feasibility triangle used to reconcile competing tool choices
  evidence_weighting_pattern: standardized/best-practice methods weighted over one-off studies
paragraph_rhetoric:
