geography_reasoning:
  whether_geography_is_central: partially — geography enters via regionalized impact assessment, not regional structure
  spatial_scale_usage: product→sector→economy scale ladder is an explicit analytic axis
  regional_differentiation_usage: site-dependence of impacts motivates regionalized characterization factors
  spatial_heterogeneity_usage: heterogeneity framed as accuracy requirement (water stress, species assemblages, population density)
  cross_scale_usage: coupling IAMs (macro) with process LCA (micro) as core frontier
  place_context_usage: locations of emission shown to matter for validity, not for narrative color
  human_environment_usage: consumption behavior and equity (top-1% vs bottom-50% footprints) brought in
