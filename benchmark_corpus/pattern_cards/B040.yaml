  source_pages: ["pp. 631-644 (journal); opening p. 632; slices @17%, @33% p. 637, @50%, @67% p. 641, @83% p. 643"]
  source_sections: [Introduction, Global trends, Asia, North America, Europe, Limitations in spatiotemporal coverage, Future trends in HABs, Table 1, figure captions]
