  number_of_major_sections: 7
introduction_pattern:
  opening_move: dual-pressure framing (urbanisation plus climate change exacerbating flood risk)
  problem_contextualization: traditional single-purpose drainage transfers risk downstream and degrades streams
  fragmentation_statement: management siloed by objective (flood-only) rather than literature fragmentation per se
  gap_or_need_statement: "Transforming stormwater systems is thus urgently needed" — transformation need as gap
  review_objective_statement: delivered via 'Finally, we consider ...' forward pointer closing the introduction
  scope_definition: definitional primer section ('it is first important to provide context on what urban hydrology is')
  contribution_statement: integrated socio-technical-governance synthesis beyond single-objective engineering reviews
  roadmap_pattern: present but compact (forward-pointing final sentences rather than numbered itinerary)
