overall_review_design:
  review_objective: Show how urban stormwater concerns, expectations, technologies and governance must transform under climate change
  review_scope: urban stormwater management worldwide — hydrology fundamentals through governance and business models
  review_mode: thematic narrative with an evolution/transition arc across social and technical dimensions
  article_architecture: [Abstract, Introduction, Urban hydrology, Evolving concerns, Changing expectations, Changing technologies, Governance and business models, Summary and future perspectives]
