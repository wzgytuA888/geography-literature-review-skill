overall_review_design:
  review_objective: >-
    Highlight environmental impacts of food production that feed back to threaten production itself,
    and review solutions and research priorities for sustainable transformation.
  review_scope: climate, soil, water, biodiversity impacts of production; reverse impacts of environmental change on crops/livestock/aquatic food; supply- and demand-side interventions.
  review_mode: narrative feedback-loop synthesis with solution-oriented closing sections.
  article_architecture:
    - Abstract
    - Key points
    - Introduction
    - Environmental impacts of food production
    - Impacts of changing [environment on food production]
    - Amplified feedback
    - Supply-side transformations / demand-side interventions
    - Summary and future
    - References
  organizing_principle: bidirectional feedback logic (production -> environment -> production) then intervention taxonomy
  number_of_major_sections: 6
