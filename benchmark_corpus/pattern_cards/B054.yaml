  spatial_heterogeneity_usage: vulnerability concentrated in tropics/sub-Saharan Africa — explicit geographic risk statement.
  cross_scale_usage: local practices aggregated to global pressures via trade (Box 1 telecoupling).
  place_context_usage: continents and nations named as strategy units rather than case studies.
  human_environment_usage: constitutive — human-environment feedback is the organizing frame.
  flow_network_usage: international food trade mapped as burden-shifting flows.
