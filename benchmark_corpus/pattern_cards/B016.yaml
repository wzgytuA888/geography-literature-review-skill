  topic_sentence_pattern: subsection-label echo sentences
  synthesis_sentence_pattern: '"These contrasting trends highlight why ..." lesson-extraction sentences'
  contrast_sentence_pattern: '"In contrast, in rainforest environments ..." biome flips'
  limitation_sentence_pattern: '"These proxies, unfortunately, do not directly scale to ..." candid data caveats'
  transition_pattern: scale-step transitions (global -> regional -> future)
  paragraph_length_profile: medium (~498-char median)
