overall_review_design:
  review_objective: >-
    Describe how human-environment interaction shapes fire activity through a
    pyrogeography lens; synthesize trends, projections, effects, adaptation.
  review_scope: global to biome/regional fire regimes, Earth-system effects, future projections, adaptation and research priorities
  review_mode: state-trends-futures-responses synthesis
  article_architecture:
    - Introduction (unheaded, disaster salience + roadmap)
    - Contemporary fire regimes (Global trends / Regional trends run-in subsections)
    - Future fire regimes
    - Earth-system effects of changing fire regimes
    - Adaptation and management
    - Research priorities/outlook
    - Table 1 (future-change study summary); Key points box
  organizing_principle: "mixed(scale ladder global->regional/biome within thematic blocks)"
  number_of_major_sections: 5
introduction_pattern:
  opening_move: disaster-salience framing with named recent events (Chile 2017, Portugal 2018, California 2018, Australia 2019-2020)
  problem_contextualization: monetized losses (AUD $100 billion Black Summer) establish stakes
  fragmentation_statement: >-
    Trend interpretation contested because records are short; "it is unclear if these disasters are evidence of increasing global fire activity".
  gap_or_need_statement: policy need ("to inform adaptation and mitigation policies") plus data-completeness deficit
  review_objective_statement: '"In this Review, we describe how human-environmental interaction shapes fire activity".'
  scope_definition: explicit analytic lens declared (pyrogeography); dual climate-plus-land-modification drivers
  contribution_statement: roadmap promises trends, projections, effects, adaptation, research priorities
  roadmap_pattern: present
section_architecture:
  section_order: [Intro, Contemporary regimes (global then regional), Future regimes, Effects, Adaptation, Priorities]
  dominant_logic: scale-ladder description then consequence then response
  chronological_logic: partial (deep-time fire history context)
  thematic_logic: central
  mechanism_logic: partial
  scale_logic: central
  region_logic: central
  method_logic: none
  transition_between_sections:
    - '"Regional analyses are essential ..." pivot from global to regional evidence'
    - '"These contrasting trends highlight why ..." synthesis pivots'
argumentation:
  dominant_argument_pattern: gradient/framework claim -> regional instantiation -> metric critique where simple trends mislead
  claim_evidence_relation: unimodal productivity-fire relationship used as integrative frame for regional contrasts
  comparison_pattern: biome-by-biome return-interval comparison (savannah vs rainforest vs boreal)
  contradiction_handling: >-
    Apparent contradictions resolved by scale/metric critique; sole focus on area burned shown inadequate for risk trends.
  boundary_condition_handling: fuel-limitation condition on climatically fire-prone arid regions
  limitation_handling: record limitations itemized (short national records, proxy scaling failures, satellite era too brief)
  gap_identification_pattern: gaps derived from data infrastructure deficits plus undocumented extreme phenomena
synthesis:
  synthesis_unit: theme (fire-regime component) and geographic domain
  study_by_study_ratio: low
  multi_source_synthesis_pattern:
    - evidence-summary table of selected studies by domain with direction verdicts (Table 1)
    - consensus statement device; "Overall, there is general agreement amongst the studies"
    - emissions-partition quantification synthesizing many source estimates
  consensus_pattern: agreement asserted after tabulating heterogeneous studies
  controversy_pattern: trend disputes traced to record length and metric choice rather than duelling citations
  reconciliation_pattern: contrasting regional trajectories reconciled by differing human-fire management histories
  evidence_weighting_pattern: >-
    Studies weighted by record quality/density; well-studied regions flagged as such ("owing to their comparatively high density of researchers").
