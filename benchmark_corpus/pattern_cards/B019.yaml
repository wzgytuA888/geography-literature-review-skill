gap_and_agenda:
  how_gaps_are_derived: derived jointly from science shortfalls and technology trajectory (taller turbines, offshore, larger arrays)
  types_of_gaps: [observational archive gaps, model-physics gaps (drag, boundary layer), coupled-modelling gaps]
  evidence_required_before_gap_claim: demonstrated model divergence or extrapolation invalidity
  future_agenda_structure: imperatives naming agent, action and product ("research initiatives need to archive output at WT-relevant heights")
  specificity_of_future_questions: highly operational (heights, resolutions, products specified)
quality_features:
  major_strengths:
    - explicit "Statement of needs" organizing device
    - scale matrix making multiscale relevance checkable
    - dual-model verification culture
  transferable_patterns:
    - needs-driven architecture for applied reviews
    - regional-subdomain panels reused across multiple figures
    - caption-as-finding interpretive captions
  unique_but_nontransferable_features:
    - engineering-standard citations (IEC) unusual outside sector reviews
  risks_of_imitation:
    - scenario arithmetic invites double-counting errors if displacement assumptions are unstated
anti_patterns:
  weak_patterns_to_avoid:
    - fitting linear trends to short autocorrelated series and reporting them as secular change
