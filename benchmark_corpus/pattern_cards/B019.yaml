overall_review_design:
  review_objective: >-
    Assess how climate change and variability affect wind energy resources,
    operating conditions and projections, and state research needs.
  review_scope: wind resource across atmospheric scales; interannual variability/teleconnections; turbine operating conditions; future projections
  review_mode: needs-driven sectoral synthesis with scale-matrix organization
  article_architecture:   # partly reconstructed; intro text poorly extracted
    - Industry status and installed-capacity projections
    - Statement of needs (explicit heading)
    - Wind resource fundamentals by scales of motion
    - Climate-mode influences on resources (teleconnections)
    - Operating conditions (icing, erosion, waves, loading)
    - Climate projections of resource
    - Summary/research needs
    - Tables 1-3 (scale matrix; IAV precis; projection precis); Figs 1-4
  organizing_principle: "mixed(scale matrix (micro->macro) x thematic impacts x regional subdomains)"
  number_of_major_sections: UNKNOWN (approximately 5-6)
introduction_pattern:
  opening_move: industry-trajectory framing (installed capacity growth, avoided-emissions arithmetic)
  problem_contextualization: mitigation stakes computed (up to 0.3 degC avoided warming by 2100 under aggressive expansion)
  fragmentation_statement: paucity-of-research statements per impact area ("a relative paucity of research into how ...")
  gap_or_need_statement: dedicated "Statement of needs" section makes requirements explicit early
  review_objective_statement: UNKNOWN (intro not preserved verbatim)
  scope_definition: scales of motion table delimits which atmospheric phenomena matter and why
  contribution_statement: couples GWEC deployment scenarios to climate sensitivity of the resource
  roadmap_pattern: present as needs-list architecture rather than narrative roadmap
section_architecture:
  section_order: [Status/scenarios, Statement of needs, Resource fundamentals, Variability/modes, Operating conditions, Projections, Needs summary]
  dominant_logic: requirement-driven; each later section answers a stated need
  chronological_logic: none
  thematic_logic: central
  mechanism_logic: partial
  scale_logic: central
  region_logic: central
  method_logic: partial (model-comparison protocol)
  transition_between_sections:
    - 'needs enumerated up front are answered section by section'
    - '"There is, therefore, a need to refine ..." closers converting findings into requirements'
argumentation:
  dominant_argument_pattern: regional-difference demonstration then uncertainty source analysis then need statement
  claim_evidence_relation: model-intercomparison results cited with resolution/formulation caveats
  comparison_pattern: five high-penetration subdomains compared repeatedly across figures; two models (WRF vs MPAS) cross-checked
  contradiction_handling: >-
    Contested trend claims rebutted methodologically; low-frequency variability "misinterpreted as trends" explains global stilling claims.
  boundary_condition_handling: applicability bounds by turbine class and environmental regime
  limitation_handling: parameterization drag uncertainty treated as first-order error source
  gap_identification_pattern: gaps phrased as capability shortfalls tied to industry evolution (hub heights, offshore expansion)
synthesis:
  synthesis_unit: proposition (impact pathway) stratified by region and atmospheric scale
  study_by_study_ratio: low
  multi_source_synthesis_pattern:
    - evidence-summary tables (precis of studies by region with directional verdicts)
    - scale matrix unifying phenomena across micro/meso/macro
    - scenario-conditioned mitigation arithmetic synthesizing energy and climate pathways
  consensus_pattern: agreement on sign of change reported only where multi-model consistency exists
  controversy_pattern: stilling debate resolved by critiquing record length, linear fitting, autocorrelation neglect
  reconciliation_pattern: mode-by-region interaction table reconciles apparently inconsistent teleconnection responses
  evidence_weighting_pattern: >-
    Weighted by model fidelity and vertical representation; simple power-law extrapolations flagged as increasingly inappropriate.
paragraph_rhetoric:
  common_rhetorical_moves:
    - regional-panel narration ("comparatively low in ..., moderate in ..., high in ...")
    - imperative need sentences with named agents
    - quantitative exception clauses ("not directly opposite")
  typical_move_sequences:
    - [regional pattern statement, mode attribution, non-linearity caveat, data/model caveat]
  topic_sentence_pattern: variable-or-region-named declaratives
  synthesis_sentence_pattern: '"There is, thus, substantial climate mitigation benefit ..." consequence summaries'
  contrast_sentence_pattern: '"In North America, by contrast ..." region flips'
  limitation_sentence_pattern: uncertainty-source paragraphs ending in refinement needs
  transition_pattern: need-answer chaining between sections
  paragraph_length_profile: medium (~448-char median)
citation_behavior:
  citations_per_paragraph: {p25: 0, median: 0, p75: 2}   # digest blocks include reference text
  citation_cluster_frequency: moderate
