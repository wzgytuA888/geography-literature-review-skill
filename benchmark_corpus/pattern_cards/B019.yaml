  gap_citation_pattern: paucity statements supported by scoped search-style phrasing
geography_reasoning:
  whether_geography_is_central: yes
  spatial_scale_usage: explicit micro-beta to macro-alpha atmospheric-scale hierarchy (Table 1)
  regional_differentiation_usage: five subdomains tracked through resource, variability and projections
  spatial_heterogeneity_usage: projected resource declines in north/northwest vs gains elsewhere within one domain
  cross_scale_usage: synoptic events to multidecadal modes linked to same load variables
  place_context_usage: countries named as resource archetypes (Denmark, NE Brazil, S.E. India)
  human_environment_usage: mitigation benefit and infrastructure exposure connect climate to society
  flow_network_usage: grid/integration considerations noted for intermittency
  spatial_dependence_usage: teleconnection footprints map onto resource regions deterministically
