overall_review_design:
  review_objective: >-
    Synthesize what water vapour residence time (WVRT) metrics mean, reconcile
    discrepant estimates, and assess WVRT change under warming.
  review_scope: >-
    Metric definitions (TUT, AGE, BTT, FTT, lifetime distribution); global and regional
    estimates; isotope constraints; anthropogenic change; research priorities.
  review_mode: >-
    Concept-clarification narrative — a taxonomy of competing metrics is built, then a
    unifying construct (lifetime distribution) reconciles them.
  article_architecture:
    - Abstract/lead-in with explicit roadmap paragraph
    - A metric of the atmospheric water cycle (definitions; Box 1)
    - Lifetime distribution variability (surface-condition controls)
    - Regional estimates of WVRT / global patterns
    - Stable isotopes as constraints (AGE-isotope relation)
    - WVRT and anthropogenic climate change
    - Future research priorities and pathways
    - Table 1 compiled rates of change; Box 1 metric glossary
  organizing_principle: mixed — methodological core (define/reconcile), then regional pattern layer, then change/attribution layer, closing agenda
  number_of_major_sections: 6-7   # exact boundaries partly obscured by small-caps extraction
