  problem_contextualization: metric confusion shown to produce contrasting estimates for one quantity
  fragmentation_statement: explicit — "Several metrics have emerged to quantify the various" aspects without unification
  gap_or_need_statement: in-depth assessment motivated by WVRT's indicator role for hydrological change
  review_objective_statement: explicit ("we synthesize current knowledge concerning WVRT and highlight it as an essential indicator")
  scope_definition: metric set enumerated before analysis begins
  contribution_statement: reconciliation of estimates via lifetime-distribution framing
  roadmap_pattern: present — four-move sentence roadmap ("We begin by ... We then ... We subsequently ... end with")
