    - Key-points box whose bullets are themselves calibrated attribution statements
    - annotated selected references
    - evidence-source boxes separating observational from model-based knowledge
  transferable_patterns:
    - attribution-question framing giving the review a falsifiable spine
    - evidence-base audit section before any trend claims
    - graded-verdict language mapped to scale (unequivocal basin / inconclusive regional)
  unique_but_nontransferable_features:
    - coral-proxy extension specific to tropical ocean archives
  risks_of_imitation:
    - heavy dataset plumbing can overwhelm readers without the Box-based offloading used here
