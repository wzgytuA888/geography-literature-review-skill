overall_review_design:
  review_objective: >-
    Synthesize Indian Ocean heat/freshwater changes at decadal-to-multidecadal
    scales to test whether hydrological intensification has occurred.
  review_scope: basin and Maritime Continent region; observations, modes of variability, thermodynamic/dynamic drivers, coral-proxy context, projections
  review_mode: attribution-question-driven synthesis with explicit evidence-base audit
  article_architecture:
    - Introduction (unheaded, societal stakes + attribution question + roadmap)
    - Indian Ocean climatological conditions (basin distinctiveness)
    - Observational basis (in situ, Argo, moorings, remote sensing)
    - Modes of variability (IOD, ENSO, IPO)
    - Drivers of multi-decadal change (Thermodynamic considerations / Dynamical considerations run-in subsections)
    - Palaeo perspective (coral proxies)
    - Summary and future perspectives
    - Box 1 (observations and corals), Box 2 (reanalyses and models); Figs 1-5; Key points box
  organizing_principle: "mixed(evidence-source -> mechanism -> attribution verdict; scale ladder interannual to centennial)"
  number_of_major_sections: 6
introduction_pattern:
  opening_move: societal-vulnerability framing (agrarian Indian Ocean rim rainfall dependence)
  problem_contextualization: regional sea-level and rainfall extremes tied to basin changes
  fragmentation_statement: sparse observational network leaves trend magnitude/confidence contested at regional scales
  gap_or_need_statement: disentangling natural multidecadal variability from forced change is the stated need
  review_objective_statement: '"In this Review, we synthesize current understanding of Indian Ocean heat and freshwater changes".'
  scope_definition: timescale band (decadal to multi-decadal) plus focal region (broader Indian Ocean with MC focus) declared
  contribution_statement: distinctive move — recruits coral proxies for long-term context of satellite-era trends
  roadmap_pattern: present ("We highlight ... The observed changes ... are evaluated ... We finish by highlighting outstanding challenges")
section_architecture:
  section_order: [Intro, Climatological setting, Observational basis, Modes of variability, Drivers (thermo/dynamical), Palaeo context, Summary/futures]
  dominant_logic: evidence inventory -> process explanation -> attribution verdict
  chronological_logic: partial (record-length ordering of evidence types)
  thematic_logic: central
  mechanism_logic: central
  scale_logic: central
  region_logic: central
  method_logic: partial (data-source evaluation)
  transition_between_sections:
    - '"Several unique characteristics distinguish the climatological structure ..." setup openers'
    - palaeo section framed as providing "context for the observational ... data sets"
argumentation:
  dominant_argument_pattern: thermodynamic-vs-dynamic decomposition then variability-vs-forced-signal adjudication
  claim_evidence_relation: claims graded by data source capability; each trend tied to named observing systems
  comparison_pattern: basin-scale vs regional-scale verdicts compared; multiple data sources cross-checked
  contradiction_handling: >-
    Attribution tension held explicitly: basin warming "unequivocally attributed" while regional trends show "inconclusive evidence".
  boundary_condition_handling: sampling-footprint mismatches bound comparability of satellite vs in situ products
  limitation_handling: per-dataset quality caveats (coastal altimetry, salinity sparsity) attached where used
  gap_identification_pattern: gaps = sustained-observation deficits blocking detection/attribution
synthesis:
  synthesis_unit: proposition (signal) qualified by source, depth and timescale
  study_by_study_ratio: low
  multi_source_synthesis_pattern:
    - complementary-data-sources synthesis ("Different data sources can provide complementary information")
    - thermodynamic/dynamic factor decomposition applied across variables
    - proxy-plus-instrument stitching to extend record before 1980
  consensus_pattern: '"At the broad scale, there is general agreement ..., albeit with low confidence" calibrated consensus'
  controversy_pattern: hiatus-era OHC debate folded into IPO-phase explanation rather than left as dispute
  reconciliation_pattern: apparent trend acceleration decomposed into forced signal plus natural IPO phasing rather than left as dispute
  evidence_weighting_pattern: >-
    Evidence weighted by observing-system era (Argo post-2003; satellite salinity post-2010); pre-instrumental claims routed through corals.
