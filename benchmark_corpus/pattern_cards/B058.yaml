  topic_sentence_pattern: control-led ("Absorbed shortwave radiation, controlled by surface albedo,...").
  synthesis_sentence_pattern: quantitative sensitivity statements binding driver to response.
  contrast_sentence_pattern: before/after regime contrasts (pre-1990s vs 2011-2020 budgets).
  limitation_sentence_pattern: named-model-gap sentences pointing to specific intercomparisons.
  transition_pattern: temporal hand-offs; preview clauses.
  paragraph_length_profile: q25=451, median=565, p75=778 chars — tightest paragraphs in batch.
