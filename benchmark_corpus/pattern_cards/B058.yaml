geography_reasoning:
  whether_geography_is_central: yes — a single place studied through its spatially varying processes.
  spatial_scale_usage: elevation bands, marginal vs interior zones, ice-sheet-wide extents all load-bearing.
  regional_differentiation_usage: site-level palaeo records (Site J, DYE3, Nuussuaq) differentiated within one ice sheet; regional warming asymmetries.
  spatial_heterogeneity_usage: melt confinement below ~2,000 m elevation and its weakening tracked as key change.
  cross_scale_usage: synoptic circulation (blocking) to surface energy balance coupling.
  place_context_usage: named sites/stations as evidence points on maps and timelines.
  human_environment_usage: minimal — physical glaciology focus; SLR impacts as stakes only.
  flow_network_usage: meltwater routing and ocean delivery treated as coupling pathway.
  spatial_dependence_usage: albedo-elevation-melt feedback chains are explicitly spatial.
  conditions_triggering_geographic_explanation:
    - when elevation/surface type modulates a uniform forcing
    - when circulation patterns produce regionally distinct melt episodes
