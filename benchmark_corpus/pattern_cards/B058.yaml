overall_review_design:
  review_objective: >-
    Review controls on Greenland Ice Sheet surface melt, its past/present variability and future projections,
    and how melt couples to ice sheet mass balance; identify research priorities.
  review_scope: melt physics, atmospheric/oceanic controls, palaeo (1500 CE), satellite era (1958-2024), projections to 2200, firn/runoff coupling.
  review_mode: era-partitioned mechanistic synthesis (controls -> past -> present -> future -> coupling).
  article_architecture:
    - Abstract
    - Introduction
    - Controls on GrIS melt
    - Palaeoclimate evidence sections (pre-industrial onward)
    - Observational/model reconstruction sections (1958-2024)
    - Projections of future [melt]
    - Coupling melt to ice sheet [mass balance]
    - Summary and future
    - Box 1
  organizing_principle: mixed(mechanistic controls first, then explicit time windows, then system coupling)
  number_of_major_sections: 6-7
introduction_pattern:
  opening_move: sea-level stakes with error bars (4,900 +/- 261 Gt; 13.4 +/- 0.7 mm; 7.42 m potential).
  problem_contextualization: SMB-vs-dynamics decomposition; why surface melt dominates now and will continue to.
  fragmentation_statement: "\"deep uncertainty, reflecting limited agreement on key processes\" — divergence as motivation."
  gap_or_need_statement: projection spread tied to poorly constrained process interactions.
  review_objective_statement: delivered via the most elaborate roadmap in batch — "We begin by outlining..., before evaluating..., then assessing... and analysing... Finally, we examine...".
  scope_definition: time windows declared numerically (since 1500 CE; 1958-2024; to 2200) inside the roadmap.
  contribution_statement: cross-era synthesis plus coupling analysis and priorities.
  roadmap_pattern: present, multi-clause with explicit temporal anchors.
section_architecture:
  section_order: [Abstract, Introduction, Controls (energy balance, warming/circulation), Palaeo era, Instrumental era, Projections, Melt-mass-balance coupling, Summary-future]
  dominant_logic: mechanism primer then chronological eras then forward coupling
  chronological_logic: central
  thematic_logic: central
  mechanism_logic: central
  scale_logic: partial
  region_logic: partial
  method_logic: partial
  transition_between_sections:
    - roadmap sentence pre-declares every section boundary
    - "\"are now discussed\" style previews at section heads"
argumentation:
  dominant_argument_pattern: mechanism-to-projection chain - physics explains variability, variability calibrates trust in projections.
  claim_evidence_relation: sensitivities quantified (roughly one third more melt per degree); era claims anchored to named records.
  comparison_pattern: era-versus-era budget comparisons; model-versus-model spread against an observational benchmark.
  contradiction_handling: inter-model divergence attributed process-by-process (blocking representation, firn retention).
  boundary_condition_handling: melt-runoff partitioning conditioned on elevation zone and firn state.
  limitation_handling: every named uncertainty paired with a proposed remedy or intercomparison project.
  gap_identification_pattern: model-deficiency decomposition converted into targeted community vehicles.
synthesis:
  synthesis_unit: process or era-bounded finding
  study_by_study_ratio: low
  multi_source_synthesis_pattern:
    - multi-site ice-core records composited into one timeline figure
    - model intercomparison results summarized against observational benchmarks
    - correlation statistics used to rank drivers of variance
  consensus_pattern: robust relationships quantified ("melt typically increases by approximately one third for each additional 1 °C").
  controversy_pattern: "\"Climate models diverge in their representation\" — divergence itemized by missing process (blocking, firn retention)."
  reconciliation_pattern: prescribes targeted intercomparison projects (GrSMBMIP, RetMIP) as convergence mechanisms.
  evidence_weighting_pattern: observations anchor; reanalyses bridge; models for projections only.
paragraph_rhetoric:
  common_rhetorical_moves:
