  number_of_major_sections: 7
introduction_pattern:
  opening_move: hazard-class framing with velocity/volume ranges, then pivot away from the assumed high-mountain locus
  problem_contextualization: previous assumptions treated fringe landslides as ancient and stabilised; monitoring now contradicts this
  fragmentation_statement: attention bias argued empirically — mapping biased towards arid, imagery-friendly regions
  gap_or_need_statement: "no attempt so far to review large coalescent landslide areas affecting tablelands"
  review_objective_statement: "Our objective is to evaluate landslide types, ages, activity and geological and topographical factors"
  scope_definition: numeric inclusion/exclusion criteria (fringe >=10 km; slide >=1 km2; loess and marine terraces excluded)
  contribution_statement: first synthesis plus climate/cryosphere emphasis rather than new data collection
  roadmap_pattern: present (objective sentence followed by scope, exclusions, objective restatement)
