  review_type: narrative
overall_review_design:
  review_objective: Evaluate landslide types, ages, activity and controlling factors along continental tablelands, emphasising climate-change links
  review_scope: Subaerial coalescent landslide fringes on layered-caprock tablelands on Earth; submarine and extraterrestrial occurrences excluded
  review_mode: expert narrative synthesis organised around mechanism classes and controlling factors
  article_architecture: [Abstract, Key points, Introduction, Distribution and characteristics of failed tablelands, Mechanisms of tableland failure, Factors influencing tableland instability, Landslide triggers, Tableland failure over time, Summary and future perspectives, Box 1]
