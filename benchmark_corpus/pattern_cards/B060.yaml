overall_review_design:
  review_objective: >-
    Synthesize physical, sedimentological and biogeochemical controls on suspended particulate matter (SPM)
    along the land-ocean continuum and recommend monitoring/modeling priorities under global change.
  review_scope: floc structure/composition, organo-mineral interactions, transport/settling behavior, biogeochemical implications, anthropogenic perturbations.
  review_mode: bottom-up mechanistic synthesis from composition to system perturbation.
  article_architecture:
    - Abstract
    - Key points
    - Introduction
    - Structure and composition of SPM (structural characteristics; minerals; organic matter/living organisms)
    - Organo-mineral interactions
    - Influence of transport, [settling and deposition]
    - Implications (biogeochemical cycles, contaminants)
    - Human activities and climate change
    - Summary and future
  organizing_principle: compositional hierarchy -> interaction mechanisms -> dynamic behavior -> global change implications
  number_of_major_sections: 6-7
introduction_pattern:
  opening_move: ubiquity-and-role definition of SPM plus an invariant empirical relationship announced early.
  problem_contextualization: quantified global perturbation (3,200 Pg trapped by dams; 49% coastal delivery reduction) then "their impacts remain poorly constrained".
  fragmentation_statement: transdisciplinary gap — "resolving underlying controlling mechanisms requires a transdisciplinary approach" (Key points).
  gap_or_need_statement: poorly constrained impacts + spatiotemporal variability unresolved by single disciplines.
  review_objective_statement: "\"In this Review, we discuss the physical and biological processes governing SPM characteristics\"."
  scope_definition: land-ocean continuum declared as spatial frame; phases (dissolved/colloidal/particulate) delimited by operational filtering.
  contribution_statement: mechanism synthesis + parameterization guidance for models + recommendations.
  roadmap_pattern: present ("we discuss... We explore... We then discuss... before considering... Finally...").
section_architecture:
  section_order: [Abstract+Key points, Introduction, Structure-composition, Organo-mineral interactions, Transport-settling, Implications, Human-climate change, Summary-future]
  dominant_logic: bottom-up build — parts -> interactions -> behavior -> planetary change
  chronological_logic: none
  thematic_logic: central
  mechanism_logic: central
  scale_logic: partial
  region_logic: partial
  method_logic: partial
  transition_between_sections:
    - "\"This section outlines...\" previews"
    - size-scale narrative carries reader across sections (micrometre structure to global fluxes)
argumentation:
  dominant_argument_pattern: structure-begets-behavior - composition and interactions explain transport outcomes.
  claim_evidence_relation: empirical regularities demonstrated across systems before being used explanatorily.
  comparison_pattern: regime contrasts (dilute versus concentrated, cohesive versus non-cohesive) and position-along-continuum comparisons.
  contradiction_handling: opposing regional trends acknowledged and mechanistically excused (rising tropical fluxes).
  boundary_condition_handling: settling behavior bounded by turbulence, concentration and organic buoyancy.
  limitation_handling: parameterization deficits stated as model-facing limitations.
  gap_identification_pattern: monitoring and parameterization needs enumerated as concrete quantification targets.
synthesis:
  synthesis_unit: structural component or controlling mechanism
  study_by_study_ratio: low
  multi_source_synthesis_pattern:
    - invariant relationships elevated to Key points as emergent synthesis findings
    - cross-setting generalization ("hold regardless of latitude, climate, salinity and geomorphic setting")
    - mineral/organic/biotic component inventories merged into one composition figure
  consensus_pattern: power-law-style relationships presented as cross-system regularities.
  controversy_pattern: opposing trends acknowledged regionally ("opposing trends observed in some regions") with tropical exception explained.
  reconciliation_pattern: reconciles concentration-dependent reversals via mechanistic regimes (hindered settling; TEP buoyancy).
  evidence_weighting_pattern: lab experiments for mechanism; field/global datasets for magnitude.
