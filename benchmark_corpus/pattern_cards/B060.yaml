  synthesis_sentence_pattern: relationship-plus-domain sentences ("POC enrichment ... occurs along the vertical axis owing to differential settling").
  contrast_sentence_pattern: dense-vs-dilute, cohesive-vs-non-cohesive regime contrasts.
  limitation_sentence_pattern: parameterization deficits flagged for models.
  transition_pattern: scale-stepping transitions; preview sentences.
