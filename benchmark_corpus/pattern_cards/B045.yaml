geography_reasoning:
  whether_geography_is_central: yes — trade geography is the object; maps are primary evidence
  spatial_scale_usage: country-to-subnational scaling shown to change conclusions (interprovincial China, US states)
  regional_differentiation_usage: persistent exporter bloc (Americas, Australia) vs importer bloc (Asia, Europe, MENA) structure
  spatial_heterogeneity_usage: heterogeneity between commodity networks stressed — one network per product class
  cross_scale_usage: telecoupling framework explicitly links consumption sites to production sites across continents
  place_context_usage: places function as nodes whose roles changed over time (China's rise as importer)
  human_environment_usage: fully coupled — economic trade displaces hydrological impacts
  flow_network_usage: central — Sankey diagrams and network language ('connections', 'dominant fluxes')
  spatial_dependence_usage: import dependence redistributes scarcity; unequal exchange formalised as hydrological dependence
