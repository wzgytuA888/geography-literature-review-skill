# Search plan template → runs/<id>/search/search-plan.yaml
# Google Scholar API only. Map every query to provider-supported params.

topic: ""
review_mode: ""
concepts:
  - concept: ""
    synonyms: []
    historical_terms: []
    theory_terms: []
    method_terms: []
    geography_terms: []
    region_terms: []
    temporal_terms: []
query_families:
  - qid: Q1
    purpose: broad-recall   # broad-recall|high-precision|seminal|recent|methods|regional
    boolean_string: '"exact phrase" OR synonym1 OR synonym2'
    year_lo:
    year_hi:
    max_pages: 3            # <= provider cap from preflight
stopping_rule:
  max_total_results:
  saturation_criteria: "two consecutive rounds with no new themes"
date_coverage: {from: , to: }
language_scope: [en]
provider_limits_note: "filled from preflight capability report"
