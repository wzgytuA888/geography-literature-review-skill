<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Geography literature review skill v3 multi-agent workflow</title>
  <desc id="desc">Protocol-first staged workflow from a research topic through search, selection, evidence appraisal, geographic synthesis, writing, independent audit, and three readiness outcomes.</desc>
  <defs>
    <style>
      .box{fill:#eef4ff;stroke:#315a8a;stroke-width:2;rx:12}.gate{fill:#fff3bf;stroke:#946c00;stroke-width:2}.ok{fill:#d8f3dc;stroke:#287a3e;stroke-width:2}.warn{fill:#ffe3e3;stroke:#a63b3b;stroke-width:2}.t{font:18px Arial,sans-serif;fill:#162333}.s{font:14px Arial,sans-serif;fill:#31445b}.arrow{stroke:#536b86;stroke-width:2;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#536b86"/></marker>
  </defs>
  <rect x="500" y="20" width="400" height="62" class="box"/><text x="700" y="57" text-anchor="middle" class="t">Research topic → Orchestrator</text>
  <line x1="700" y1="82" x2="700" y2="110" class="arrow"/>
  <rect x="270" y="112" width="860" height="70" class="box"/><text x="700" y="142" text-anchor="middle" class="t">Wave 0: Protocol Architect + Domain/Mechanism Theorist</text><text x="700" y="166" text-anchor="middle" class="s">question · scope · contribution · protocol freeze</text>
  <line x1="700" y1="182" x2="700" y2="210" class="arrow"/>
  <rect x="270" y="212" width="860" height="70" class="box"/><text x="700" y="242" text-anchor="middle" class="t">Wave 1–2: Search Strategist + Peer Reviewer + Parallel Scouts</text><text x="700" y="266" text-anchor="middle" class="s">source plan · sentinel recall · exact logs · open/field/grey/regional sources</text>
  <line x1="700" y1="282" x2="700" y2="310" class="arrow"/>
  <rect x="270" y="312" width="860" height="70" class="box"/><text x="700" y="342" text-anchor="middle" class="t">Librarian + Screeners A/B + Adjudicator</text><text x="700" y="366" text-anchor="middle" class="s">report → study → site/outcome · independent decisions · flow counts</text>
  <line x1="700" y1="382" x2="700" y2="410" class="arrow"/>
  <polygon points="700,412 940,462 700,512 460,462" class="gate"/><text x="700" y="458" text-anchor="middle" class="t">Critical full text available?</text><text x="700" y="480" text-anchor="middle" class="s">Full-text Verifier</text>
  <line x1="460" y1="462" x2="220" y2="462" class="arrow"/><rect x="20" y="430" width="190" height="64" class="warn"/><text x="115" y="456" text-anchor="middle" class="t">Pause / downgrade</text><text x="115" y="478" text-anchor="middle" class="s">exact access gap</text>
  <line x1="700" y1="512" x2="700" y2="540" class="arrow"/>
  <rect x="270" y="542" width="860" height="70" class="box"/><text x="700" y="572" text-anchor="middle" class="t">Wave 4: Extractor A + Verifier B + Appraisal Specialist</text><text x="700" y="596" text-anchor="middle" class="s">source locators · design-matched bias domains · dependency map</text>
  <line x1="700" y1="612" x2="700" y2="640" class="arrow"/>
  <rect x="270" y="642" width="860" height="70" class="box"/><text x="700" y="672" text-anchor="middle" class="t">Wave 5: Geospatial Analyst + Synthesis Methodologist + Certainty Agent</text><text x="700" y="696" text-anchor="middle" class="s">heterogeneity · transferability · claim ledger · certainty profile</text>
  <line x1="700" y1="712" x2="700" y2="740" class="arrow"/>
  <rect x="270" y="742" width="860" height="70" class="box"/><text x="700" y="772" text-anchor="middle" class="t">Red Team → Outline → Lead Writer → Citation/Figure Verification</text><text x="700" y="796" text-anchor="middle" class="s">contradictions · gaps · unified manuscript · verified provenance</text>
  <line x1="700" y1="812" x2="700" y2="840" class="arrow"/>
  <rect x="270" y="842" width="860" height="62" class="box"/><text x="700" y="870" text-anchor="middle" class="t">Scientific Reviewer + Journal Editor + Reproducibility Auditor</text><text x="700" y="892" text-anchor="middle" class="s">Revision Agent closes findings</text>
  <line x1="700" y1="904" x2="700" y2="925" class="arrow"/>
  <rect x="70" y="930" width="360" height="42" class="ok"/><text x="250" y="957" text-anchor="middle" class="t">SUBMISSION_CANDIDATE</text>
  <rect x="520" y="930" width="360" height="42" class="gate"/><text x="700" y="957" text-anchor="middle" class="t">RESEARCH_DRAFT_NOT_READY</text>
  <rect x="970" y="930" width="360" height="42" class="warn"/><text x="1150" y="957" text-anchor="middle" class="t">INSUFFICIENT_EVIDENCE</text>
</svg>
